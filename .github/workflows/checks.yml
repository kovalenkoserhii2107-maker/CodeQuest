name: Campaign checks
on:
  pull_request:
  push:
    branches:
      - main
      - codex/workspace-custom-dashboards
      - codex/sandbox-ux-economy
      - codex/api-interface-polish
      - codex/visual-world-dashboard-guide
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node tests/check-plant.mjs
      - name: Install browser test tools
        run: npm install --no-save --package-lock=false @playwright/test@1.55.1
      - run: npx playwright install --with-deps chromium
      - name: Verify campaigns in Chromium
        run: |
          failed=0
          for scenario in tests/campaign-browser.mjs tests/city-world-browser.mjs tests/workbench-browser.mjs tests/sandbox-refinements-browser.mjs tests/api-polish-browser.mjs tests/visual-world-browser.mjs tests/js-practice-browser.mjs tests/production-network-browser.mjs tests/workspace-layout-browser.mjs; do
            node "$scenario" || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-screenshots
          path: tests/artifacts/
          if-no-files-found: ignore
