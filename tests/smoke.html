<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>smoke: ожидание…</title>
</head>
<body>
  <h1>Браузерный смоук-тест CodeQuest</h1>
  <pre id="out">Запуск…</pre>

  <script type="module">
    /**
     * Проверяет в реальном браузере то, чего не видно в Node: запуск кода
     * игрока через Web Worker, прогрессию цепочки и мост «код → симулятор».
     */
    import { QUESTS, questById } from '../js/data/quests.js';
    import { runSolution, isFallbackMode } from '../js/runner.js';
    import { runPlayerCode } from '../js/ui/sim.js';
    import {
      completeQuest, currentQuest, isQuestAvailable, isViewUnlocked, resetProgress, state,
      isPracticed, isQuestClosed, markPracticed, setCorpRecord, corpRecord,
      db, applyDbOps, panels, addPanel, removePanel,
    } from '../js/state.js';
    import { runConsole } from '../js/runner.js';
    import { chartFromSpec } from '../js/ui/charts.js';
    import {
      resources, addResource, spendResource, TANK_CAPACITY, ORE_CAPACITY,
    } from '../js/state.js';
    import { RouteBook } from '../js/routes.js';
    import { Market } from '../js/market.js';
    import { ThreatLog } from '../js/enemy.js';
    import { Shipyard } from '../js/shipyard.js';

    const problems = [];
    const lines = [];
    const check = (ok, message) => {
      lines.push(`${ok ? '✓' : '✖'} ${message}`);
      if (!ok) problems.push(message);
    };

    resetProgress();

    // 1. Каждое эталонное решение проходит тесты через воркер
    for (const quest of QUESTS) {
      const report = await runSolution(quest.solution, quest);
      check(report.ok, `решение ${quest.id} (${report.results.length} тестов)`);
    }

    // 2. Неверное решение не проходит, зависшее — прерывается по таймауту
    const broken = await runSolution('function createCommander() { return 1; }', QUESTS[0]);
    check(!broken.ok, 'неверное решение не засчитывается');

    if (!isFallbackMode()) {
      const hang = await runSolution('function createCommander() { return new Promise(() => {}); }', QUESTS[0]);
      check(Boolean(hang.error), 'зависшее решение останавливается по таймауту');
    }

    // 3. Прогрессия: доступно только текущее задание
    check(currentQuest().id === QUESTS[0].id, 'первым доступно первое задание цепочки');
    check(isQuestAvailable(QUESTS[0].id), 'текущее задание доступно');
    check(!isQuestAvailable(QUESTS[1].id), 'следующее задание закрыто');
    check(!isViewUnlocked(QUESTS[0].unlocks.view), 'раздел закрыт до решения');

    completeQuest(QUESTS[0].id, { source: QUESTS[0].solution });
    check(state.credits === QUESTS[0].reward.credits, 'награда за тесты начислена');
    check(!isViewUnlocked(QUESTS[0].unlocks.view), 'после одних тестов раздел ещё закрыт');
    check(isViewUnlocked('console'), 'консоль открылась после первых тестов');
    check(!isQuestAvailable(QUESTS[1].id), 'следующее задание ждёт практику');

    // 4. Практика: вызов своей функции в консоли закрывает задание
    const quest = QUESTS[0];
    const command = 'createCommander("Сергей Коваленко")';
    const run = await runConsole(quest.solution, command, { corp: { credits: 0 } });
    check(!run.error && run.value?.name === 'Сергей Коваленко', 'консоль выполняет команду на коде игрока');
    check(typeof run.preview === 'string' && run.preview.includes('Командир'), 'консоль показывает читаемый результат');

    check(quest.practice.validate(run.value, { corp: {} }) === true, 'валидатор принимает настоящий вызов');
    check(quest.practice.validate({ name: 'X' }, { corp: {} }) !== true, 'валидатор не принимает огрызок объекта');

    quest.practice.commit(run.value, { setRecord: (key, value) => setCorpRecord(key, value) }, { corp: {} });
    markPracticed(quest.id, { note: 'тест' });

    check(corpRecord('commander')?.name === 'Сергей Коваленко', 'объект игрока записан в базу корпорации');
    check(isPracticed(quest.id) && isQuestClosed(quest.id), 'задание закрыто целиком');
    check(isViewUnlocked(QUESTS[0].unlocks.view), 'раздел открылся после практики');
    check(isQuestAvailable(QUESTS[1].id), 'следующее задание открылось');
    check(!isQuestAvailable(QUESTS[2].id), 'задание через одно всё ещё закрыто');

    // Ошибка в команде не ломает консоль
    const badRun = await runConsole(quest.solution, 'createCommander(', {});
    check(Boolean(badRun.error), 'синтаксическая ошибка возвращается текстом, а не падением');

    // 5. Мост «код игрока → раздел интерфейса»
    const card = await runPlayerCode('commander', 'return createCommander("Тест");');
    check(card.value?.name === 'Тест' && !card.error, 'раздел получает данные из кода игрока');

    const locked = await runPlayerCode('shipyard', 'return createShipyard("X", []);');
    check(Boolean(locked.error), 'нерешённое задание не отдаёт данные разделу');

    // 6. Бортовая база данных: запись, чтение и операции из воркера
    const saved = db.insert('logs', { text: 'проверка' });
    check(saved.id === 1 && db.count('logs') === 1, 'запись попадает в базу и получает id');
    check(db.last('logs').text === 'проверка', 'последняя запись читается');
    check(db.find('logs', record => record.text === 'проверка') !== null, 'поиск по условию работает');

    const opsRun = await runConsole(
      'function makeLog(text) { return { text }; }',
      'db.insert("logs", makeLog("из консоли"))',
      { dbStore: db.snapshot(), data: {}, panels: [] },
    );
    check(!opsRun.error && opsRun.ops.length === 1, 'команда консоли возвращает операцию записи');
    check(db.count('logs') === 1, 'до применения операций настоящая база не меняется');

    applyDbOps(opsRun.ops);
    check(db.count('logs') === 2 && db.last('logs').text === 'из консоли', 'операции применяются к настоящей базе');

    const badOps = applyDbOps([{ type: 'insert', name: 'logs', record: 42 }]);
    check(badOps.errors.length === 1, 'база отвергает не-объект и объясняет причину');

    // 7. Панели игрока
    const panelRun = await runConsole(
      'function shipPanel(db) { return { title: "Корабль", value: db.count("ships") }; }',
      'dashboard.add("ship", shipPanel)',
      { dbStore: db.snapshot(), data: {}, panels: [] },
    );
    check(panelRun.value?.title === 'Корабль', 'dashboard.add возвращает описание панели');
    check(panelRun.ops.some(op => op.type === 'panel.add' && op.source.includes('shipPanel')),
      'исходник панели сохраняется для повторного запуска');

    applyDbOps(panelRun.ops);
    check(panels().length === 1, 'панель зарегистрирована');

    const rerun = await runConsole('', `(${panels()[0].source})(db)`, { dbStore: db.snapshot(), data: {}, panels: [] });
    check(rerun.value?.title === 'Корабль', 'сохранённая панель запускается заново');

    removePanel('ship');
    check(panels().length === 0, 'панель снимается с дашборда');

    // --- Панель игрока умеет рисовать график ---

    const chartRun = await runConsole(
      '',
      'dashboard.add("ore", db => ({ title: "Руда", type: "bar", items: [{ label: "Церера", value: 12 }] }))',
      { dbStore: db.snapshot(), data: {}, panels: [] },
    );
    check(!chartRun.error, 'панель с графиком выполняется без ошибок');

    const chartSpec = chartRun.ops.find(op => op.type === 'panel.add');
    check(Boolean(chartSpec), 'график регистрируется как обычная панель');

    const chartHtml = chartFromSpec({ type: 'bar', items: [{ label: 'Церера', value: 12 }] });
    check(chartHtml.includes('bar-row') && chartHtml.includes('Церера'), 'описание графика превращается в разметку');
    check(chartFromSpec({ title: 'Просто число', value: 5 }) === '', 'панель без типа графика остаётся текстовой');

    // --- Топливо и руда ---

    resetProgress();
    check(resources().fuel === 0 && resources().ore === 0, 'новая корпорация стартует без запасов');

    check(addResource('fuel', 100) === 100, 'топливо заливается в бак');
    check(resources().fuel === 100, 'запас топлива виден после заправки');
    check(addResource('fuel', TANK_CAPACITY) === TANK_CAPACITY - 100, 'сверх ёмкости бака не принимается');
    check(resources().fuel === TANK_CAPACITY, 'бак не переполняется');

    check(spendResource('fuel', 50) === true, 'топливо списывается');
    check(resources().fuel === TANK_CAPACITY - 50, 'остаток после списания верный');
    check(spendResource('fuel', 10_000) === false, 'нельзя списать больше, чем в баке');
    check(resources().fuel === TANK_CAPACITY - 50, 'неудачное списание ничего не меняет');

    check(addResource('ore', -5) === 0, 'отрицательное пополнение отвергается');
    check(addResource('нечто', 10) === 0, 'неизвестный ресурс не заводится на ходу');
    check(addResource('ore', ORE_CAPACITY + 100) === ORE_CAPACITY, 'бункер руды тоже ограничен');

    // --- Рейс и торговля на коде игрока ---

    const expedition = questById('expedition');
    const flight = await runSolution(expedition.solution, expedition);
    check(flight.ok, 'решение экспедиции проходит тесты');

    const trade = questById('trade');
    const sale = await runSolution(trade.solution, trade);
    check(sale.ok, 'решение торговли проходит тесты');

    const offers = new Market().getOffers();
    const deal = await runConsole(trade.solution, `sellOre(60, ${JSON.stringify(offers)})`, {});
    check(deal.value?.revenue === 50400, 'распродажа 60 т даёт выручку по лучшим ценам');
    check(deal.value?.deals?.length === 2, 'груз делится между двумя покупателями');

    const routes = new RouteBook().getRoutes();
    check(routes.length >= 3, 'в маршрутной книге есть направления');
    check(routes.every(route => route.distance > 0 && route.richness > 0), 'у каждого маршрута есть путь и богатство жилы');
    check(new RouteBook().getRoute('нет-такого') === null, 'несуществующий маршрут не выдумывается');

    // --- Бой на коде игрока ---

    const arsenal = questById('arsenal');
    check((await runSolution(arsenal.solution, arsenal)).ok, 'решение боевой сводки проходит тесты');

    const strikeQuest = questById('strike');
    check((await runSolution(strikeQuest.solution, strikeQuest)).ok, 'решение обмена ударами проходит тесты');

    const battleQuest = questById('battle');
    check((await runSolution(battleQuest.solution, battleQuest)).ok, 'решение боевого вылета проходит тесты');

    // Сводка считается по настоящему каталогу верфи, а не по выдуманным данным
    const combatModules = new Shipyard().getCatalog().filter(m => m.type === 'weapon' || m.type === 'shield');
    const stats = await runConsole(arsenal.solution, `combatStats(${JSON.stringify(combatModules)})`, {});
    check(stats.value?.attack === 135, 'атака складывается по всем орудиям каталога');
    check(stats.value?.shield === 85, 'щиты каталога тоже суммируются');

    const threats = new ThreatLog().getThreats();
    check(threats.length >= 3, 'в патрульной сводке есть противники');
    check(threats.every(t => t.attack > 0 && t.hull > 0 && t.bounty > 0), 'у каждого противника есть характеристики и премия');
    check(new ThreatLog().getThreat('нет-такого') === null, 'несуществующий противник не выдумывается');

    // Слабое орудие против тяжёлого щита: бой не выигрывается, но и не виснет
    const hopeless = await runConsole(
      battleQuest.solution,
      `runBattle({ name: "Слабый", attack: 5, shield: 0, hull: 100 }, { name: "Крейсер", attack: 80, shield: 45, hull: 260 })`,
      {},
    );
    check(hopeless.value?.winner === 'enemy', 'без пробивного орудия крейсер выигрывает');
    check(hopeless.value?.rounds <= 20, 'бой всегда укладывается в лимит раундов');

    const armedWin = await runConsole(
      battleQuest.solution,
      `runBattle({ name: "Квест", attack: 135, shield: 25, hull: 420 }, { name: "Крейсер", attack: 80, shield: 45, hull: 260 })`,
      {},
    );
    check(armedWin.value?.winner === 'ship', 'с рельсотроном крейсер выбивается');
    check(armedWin.value?.enemyHull === 0, 'у побеждённого противника корпус на нуле');

    resetProgress();
    check(
      Object.keys(state.solved).length === 0 && state.credits === 0 && !corpRecord('commander') && db.count('logs') === 0,
      'сброс возвращает игру в начало и очищает базу',
    );
    check(resources().fuel === 0 && resources().ore === 0, 'сброс опустошает бак и бункер');

    document.getElementById('out').textContent = lines.join('\n');
    document.title = problems.length === 0
      ? `smoke: OK (${lines.length} проверок)`
      : `smoke: ПРОБЛЕМ ${problems.length} — ${problems.join('; ')}`;
  </script>
</body>
</html>
