<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>smoke: ожидание…</title>
</head>
<body>
  <h1>Браузерный смоук-тест CodeQuest</h1>
  <pre id="out">Запуск…</pre>

  <script type="module">
    /**
     * Проверяет в реальном браузере то, чего не видно в Node: запуск кода
     * игрока через Web Worker, прогрессию цепочки и мост «код → симулятор».
     */
    import { QUESTS } from '../js/data/quests.js';
    import { runSolution, isFallbackMode } from '../js/runner.js';
    import { runPlayerCode } from '../js/ui/sim.js';
    import {
      completeQuest, currentQuest, isQuestAvailable, isViewUnlocked, resetProgress, state,
      isPracticed, isQuestClosed, markPracticed, setCorpRecord, corpRecord,
    } from '../js/state.js';
    import { runConsole } from '../js/runner.js';

    const problems = [];
    const lines = [];
    const check = (ok, message) => {
      lines.push(`${ok ? '✓' : '✖'} ${message}`);
      if (!ok) problems.push(message);
    };

    resetProgress();

    // 1. Каждое эталонное решение проходит тесты через воркер
    for (const quest of QUESTS) {
      const report = await runSolution(quest.solution, quest);
      check(report.ok, `решение ${quest.id} (${report.results.length} тестов)`);
    }

    // 2. Неверное решение не проходит, зависшее — прерывается по таймауту
    const broken = await runSolution('function createCommander() { return 1; }', QUESTS[0]);
    check(!broken.ok, 'неверное решение не засчитывается');

    if (!isFallbackMode()) {
      const hang = await runSolution('function createCommander() { return new Promise(() => {}); }', QUESTS[0]);
      check(Boolean(hang.error), 'зависшее решение останавливается по таймауту');
    }

    // 3. Прогрессия: доступно только текущее задание
    check(currentQuest().id === QUESTS[0].id, 'первым доступно первое задание цепочки');
    check(isQuestAvailable(QUESTS[0].id), 'текущее задание доступно');
    check(!isQuestAvailable(QUESTS[1].id), 'следующее задание закрыто');
    check(!isViewUnlocked(QUESTS[0].unlocks.view), 'раздел закрыт до решения');

    completeQuest(QUESTS[0].id, { source: QUESTS[0].solution });
    check(state.credits === QUESTS[0].reward.credits, 'награда за тесты начислена');
    check(!isViewUnlocked(QUESTS[0].unlocks.view), 'после одних тестов раздел ещё закрыт');
    check(isViewUnlocked('console'), 'консоль открылась после первых тестов');
    check(!isQuestAvailable(QUESTS[1].id), 'следующее задание ждёт практику');

    // 4. Практика: вызов своей функции в консоли закрывает задание
    const quest = QUESTS[0];
    const command = 'createCommander("Сергей Коваленко")';
    const run = await runConsole(quest.solution, command, { corp: { credits: 0 } });
    check(!run.error && run.value?.name === 'Сергей Коваленко', 'консоль выполняет команду на коде игрока');
    check(typeof run.preview === 'string' && run.preview.includes('Командир'), 'консоль показывает читаемый результат');

    check(quest.practice.validate(run.value, { corp: {} }) === true, 'валидатор принимает настоящий вызов');
    check(quest.practice.validate({ name: 'X' }, { corp: {} }) !== true, 'валидатор не принимает огрызок объекта');

    quest.practice.commit(run.value, { setRecord: (key, value) => setCorpRecord(key, value) }, { corp: {} });
    markPracticed(quest.id, { note: 'тест' });

    check(corpRecord('commander')?.name === 'Сергей Коваленко', 'объект игрока записан в базу корпорации');
    check(isPracticed(quest.id) && isQuestClosed(quest.id), 'задание закрыто целиком');
    check(isViewUnlocked(QUESTS[0].unlocks.view), 'раздел открылся после практики');
    check(isQuestAvailable(QUESTS[1].id), 'следующее задание открылось');
    check(!isQuestAvailable(QUESTS[2].id), 'задание через одно всё ещё закрыто');

    // Ошибка в команде не ломает консоль
    const badRun = await runConsole(quest.solution, 'createCommander(', {});
    check(Boolean(badRun.error), 'синтаксическая ошибка возвращается текстом, а не падением');

    // 5. Мост «код игрока → раздел интерфейса»
    const card = await runPlayerCode('commander', 'return createCommander("Тест");');
    check(card.value?.name === 'Тест' && !card.error, 'раздел получает данные из кода игрока');

    const locked = await runPlayerCode('shipyard', 'return createShipyard("X", []);');
    check(Boolean(locked.error), 'нерешённое задание не отдаёт данные разделу');

    resetProgress();
    check(
      Object.keys(state.solved).length === 0 && state.credits === 0 && !corpRecord('commander'),
      'сброс возвращает игру в начало и очищает базу корпорации',
    );

    document.getElementById('out').textContent = lines.join('\n');
    document.title = problems.length === 0
      ? `smoke: OK (${lines.length} проверок)`
      : `smoke: ПРОБЛЕМ ${problems.length} — ${problems.join('; ')}`;
  </script>
</body>
</html>
