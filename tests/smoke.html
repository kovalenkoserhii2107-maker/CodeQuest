<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>smoke: ожидание…</title>
</head>
<body>
  <h1>Браузерный смоук-тест CodeQuest</h1>
  <pre id="out">Запуск…</pre>

  <script type="module">
    /**
     * Проверяет в реальном браузере то, чего не видно в Node: запуск кода
     * игрока через Web Worker, прогрессию цепочки и мост «код → симулятор».
     */
    import { QUESTS, questById, testsOf, stageChain } from '../js/data/quests.js';
    import { runSolution, isFallbackMode } from '../js/runner.js';
    import { runPlayerCode } from '../js/ui/sim.js';
    import {
      completeQuest, currentQuest, isQuestAvailable, isViewUnlocked, resetProgress, state,
      isPracticed, isQuestClosed, markPracticed, setCorpRecord, corpRecord,
      db, applyDbOps, panels, addPanel, removePanel,
      activeStageOf, activeSourceOf, previousStageOf, appSource, liveFunctions,
      solutionOf, saveDraft, draftOf, fuelLog,
      addInventoryItem, installModule, uninstallModule, sellStockModule,
      stockModules, fittedModules,
    } from '../js/state.js';
    import { runConsole } from '../js/runner.js';
    import { chartFromSpec } from '../js/ui/charts.js';
    import {
      resources, addResource, spendResource, TANK_CAPACITY, ORE_CAPACITY,
    } from '../js/state.js';
    import { RouteBook } from '../js/routes.js';
    import { Market } from '../js/market.js';
    import { ThreatLog } from '../js/enemy.js';
    import { Shipyard } from '../js/shipyard.js';
    import { powerEfficiency, underPower } from '../js/ui/corp.js';
    import { runOutput } from '../js/ui/task.js';
    import { buildProject, orderModules } from '../js/act2/loader.js';
    import { runProject } from '../js/act2/runtime.js';
    import { chapterChain } from '../js/act2/chapters.js';
    import { runChapterChecks, isActOneDone } from '../js/ui/plant.js';
    import { writeFile, removeFile, projectFiles, isChapterDone, isViewUnlocked as viewUnlocked } from '../js/state.js';
    import { matchesSubset } from '../js/runner-core.js';

    const problems = [];
    const lines = [];
    const check = (ok, message) => {
      lines.push(`${ok ? '✓' : '✖'} ${message}`);
      if (!ok) problems.push(message);
    };

    resetProgress();

    // 1. Каждое эталонное решение проходит тесты через воркер
    for (const quest of QUESTS) {
      const report = await runSolution(quest.solution, quest);
      check(report.ok, `решение ${quest.id} (${report.results.length} тестов)`);
    }

    // 2. Неверное решение не проходит, зависшее — прерывается по таймауту
    const broken = await runSolution('function createCommander() { return 1; }', QUESTS[0]);
    check(!broken.ok, 'неверное решение не засчитывается');

    if (!isFallbackMode()) {
      const hang = await runSolution('function createCommander() { return new Promise(() => {}); }', QUESTS[0]);
      check(Boolean(hang.error), 'зависшее решение останавливается по таймауту');
    }

    // 3. Прогрессия: доступно только текущее задание
    check(currentQuest().id === QUESTS[0].id, 'первым доступно первое задание цепочки');
    check(isQuestAvailable(QUESTS[0].id), 'текущее задание доступно');
    check(!isQuestAvailable(QUESTS[1].id), 'следующее задание закрыто');
    check(!isViewUnlocked(QUESTS[0].unlocks.view), 'раздел закрыт до решения');

    completeQuest(QUESTS[0].id, { source: QUESTS[0].solution });
    check(state.credits === QUESTS[0].reward.credits, 'награда за тесты начислена');
    check(!isViewUnlocked(QUESTS[0].unlocks.view), 'после одних тестов раздел ещё закрыт');
    check(isViewUnlocked('console'), 'консоль открылась после первых тестов');
    check(!isQuestAvailable(QUESTS[1].id), 'следующее задание ждёт практику');

    // 4. Практика: вызов своей функции в консоли закрывает задание
    const quest = QUESTS[0];
    const command = 'createCommander("Сергей Коваленко")';
    const run = await runConsole(quest.solution, command, { corp: { credits: 0 } });
    check(!run.error && run.value?.name === 'Сергей Коваленко', 'консоль выполняет команду на коде игрока');
    check(typeof run.preview === 'string' && run.preview.includes('Командир'), 'консоль показывает читаемый результат');

    check(quest.practice.validate(run.value, { corp: {} }) === true, 'валидатор принимает настоящий вызов');
    check(quest.practice.validate({ name: 'X' }, { corp: {} }) !== true, 'валидатор не принимает огрызок объекта');

    quest.practice.commit(run.value, { setRecord: (key, value) => setCorpRecord(key, value) }, { corp: {} });
    markPracticed(quest.id, { note: 'тест' });

    check(corpRecord('commander')?.name === 'Сергей Коваленко', 'объект игрока записан в базу корпорации');
    check(isPracticed(quest.id) && isQuestClosed(quest.id), 'задание закрыто целиком');
    check(isViewUnlocked(QUESTS[0].unlocks.view), 'раздел открылся после практики');
    check(isQuestAvailable(QUESTS[1].id), 'следующее задание открылось');
    check(!isQuestAvailable(QUESTS[2].id), 'задание через одно всё ещё закрыто');

    // Ошибка в команде не ломает консоль
    const badRun = await runConsole(quest.solution, 'createCommander(', {});
    check(Boolean(badRun.error), 'синтаксическая ошибка возвращается текстом, а не падением');

    // 5. Мост «код игрока → раздел интерфейса»
    const card = await runPlayerCode('commander', 'return createCommander("Тест");');
    check(card.value?.name === 'Тест' && !card.error, 'раздел получает данные из кода игрока');

    const locked = await runPlayerCode('shipyard', 'return createShipyard("X", []);');
    check(Boolean(locked.error), 'нерешённое задание не отдаёт данные разделу');

    // 6. Бортовая база данных: запись, чтение и операции из воркера
    const saved = db.insert('logs', { text: 'проверка' });
    check(saved.id === 1 && db.count('logs') === 1, 'запись попадает в базу и получает id');
    check(db.last('logs').text === 'проверка', 'последняя запись читается');
    check(db.find('logs', record => record.text === 'проверка') !== null, 'поиск по условию работает');

    const opsRun = await runConsole(
      'function makeLog(text) { return { text }; }',
      'db.insert("logs", makeLog("из консоли"))',
      { dbStore: db.snapshot(), data: {}, panels: [] },
    );
    check(!opsRun.error && opsRun.ops.length === 1, 'команда консоли возвращает операцию записи');
    check(db.count('logs') === 1, 'до применения операций настоящая база не меняется');

    applyDbOps(opsRun.ops);
    check(db.count('logs') === 2 && db.last('logs').text === 'из консоли', 'операции применяются к настоящей базе');

    const badOps = applyDbOps([{ type: 'insert', name: 'logs', record: 42 }]);
    check(badOps.errors.length === 1, 'база отвергает не-объект и объясняет причину');

    // 7. Панели игрока
    const panelRun = await runConsole(
      'function shipPanel(db) { return { title: "Корабль", value: db.count("ships") }; }',
      'dashboard.add("ship", shipPanel)',
      { dbStore: db.snapshot(), data: {}, panels: [] },
    );
    check(panelRun.value?.title === 'Корабль', 'dashboard.add возвращает описание панели');
    check(panelRun.ops.some(op => op.type === 'panel.add' && op.source.includes('shipPanel')),
      'исходник панели сохраняется для повторного запуска');

    applyDbOps(panelRun.ops);
    check(panels().length === 1, 'панель зарегистрирована');

    const rerun = await runConsole('', `(${panels()[0].source})(db)`, { dbStore: db.snapshot(), data: {}, panels: [] });
    check(rerun.value?.title === 'Корабль', 'сохранённая панель запускается заново');

    removePanel('ship');
    check(panels().length === 0, 'панель снимается с дашборда');

    // --- Панель игрока умеет рисовать график ---

    const chartRun = await runConsole(
      '',
      'dashboard.add("ore", db => ({ title: "Руда", type: "bar", items: [{ label: "Церера", value: 12 }] }))',
      { dbStore: db.snapshot(), data: {}, panels: [] },
    );
    check(!chartRun.error, 'панель с графиком выполняется без ошибок');

    const chartSpec = chartRun.ops.find(op => op.type === 'panel.add');
    check(Boolean(chartSpec), 'график регистрируется как обычная панель');

    const chartHtml = chartFromSpec({ type: 'bar', items: [{ label: 'Церера', value: 12 }] });
    check(chartHtml.includes('bar-row') && chartHtml.includes('Церера'), 'описание графика превращается в разметку');
    check(chartFromSpec({ title: 'Просто число', value: 5 }) === '', 'панель без типа графика остаётся текстовой');

    // --- Топливо и руда ---

    resetProgress();
    check(resources().fuel === 0 && resources().ore === 0, 'новая корпорация стартует без запасов');

    check(addResource('fuel', 100) === 100, 'топливо заливается в бак');
    check(resources().fuel === 100, 'запас топлива виден после заправки');
    check(addResource('fuel', TANK_CAPACITY) === TANK_CAPACITY - 100, 'сверх ёмкости бака не принимается');
    check(resources().fuel === TANK_CAPACITY, 'бак не переполняется');

    check(spendResource('fuel', 50) === true, 'топливо списывается');
    check(resources().fuel === TANK_CAPACITY - 50, 'остаток после списания верный');
    check(spendResource('fuel', 10_000) === false, 'нельзя списать больше, чем в баке');
    check(resources().fuel === TANK_CAPACITY - 50, 'неудачное списание ничего не меняет');

    check(addResource('ore', -5) === 0, 'отрицательное пополнение отвергается');
    check(addResource('нечто', 10) === 0, 'неизвестный ресурс не заводится на ходу');
    check(addResource('ore', ORE_CAPACITY + 100) === ORE_CAPACITY, 'бункер руды тоже ограничен');

    // --- Рейс и торговля на коде игрока ---

    const expedition = questById('expedition');
    const flight = await runSolution(expedition.solution, expedition);
    check(flight.ok, 'решение экспедиции проходит тесты');

    const trade = questById('trade');
    const sale = await runSolution(trade.solution, trade);
    check(sale.ok, 'решение торговли проходит тесты');

    const offers = new Market().getOffers();
    const deal = await runConsole(trade.solution, `sellOre(60, ${JSON.stringify(offers)})`, {});
    check(deal.value?.revenue === 50400, 'распродажа 60 т даёт выручку по лучшим ценам');
    check(deal.value?.deals?.length === 2, 'груз делится между двумя покупателями');

    const routes = new RouteBook().getRoutes();
    check(routes.length >= 3, 'в маршрутной книге есть направления');
    check(routes.every(route => route.distance > 0 && route.richness > 0), 'у каждого маршрута есть путь и богатство жилы');
    check(new RouteBook().getRoute('нет-такого') === null, 'несуществующий маршрут не выдумывается');

    // --- Бой на коде игрока ---

    const arsenal = questById('arsenal');
    check((await runSolution(arsenal.solution, arsenal)).ok, 'решение боевой сводки проходит тесты');

    const strikeQuest = questById('strike');
    check((await runSolution(strikeQuest.solution, strikeQuest)).ok, 'решение обмена ударами проходит тесты');

    const battleQuest = questById('battle');
    check((await runSolution(battleQuest.solution, battleQuest)).ok, 'решение боевого вылета проходит тесты');

    // Сводка считается по настоящему каталогу верфи, а не по выдуманным данным
    const combatModules = new Shipyard().getCatalog().filter(m => m.type === 'weapon' || m.type === 'shield');
    const stats = await runConsole(arsenal.solution, `combatStats(${JSON.stringify(combatModules)})`, {});
    check(stats.value?.attack === 135, 'атака складывается по всем орудиям каталога');
    check(stats.value?.shield === 85, 'щиты каталога тоже суммируются');

    const threats = new ThreatLog().getThreats();
    check(threats.length >= 3, 'в патрульной сводке есть противники');
    check(threats.every(t => t.attack > 0 && t.hull > 0 && t.bounty > 0), 'у каждого противника есть характеристики и премия');
    check(new ThreatLog().getThreat('нет-такого') === null, 'несуществующий противник не выдумывается');

    // Слабое орудие против тяжёлого щита: бой не выигрывается, но и не виснет
    const hopeless = await runConsole(
      battleQuest.solution,
      `runBattle({ name: "Слабый", attack: 5, shield: 0, hull: 100 }, { name: "Крейсер", attack: 80, shield: 45, hull: 260 })`,
      {},
    );
    check(hopeless.value?.winner === 'enemy', 'без пробивного орудия крейсер выигрывает');
    check(hopeless.value?.rounds <= 20, 'бой всегда укладывается в лимит раундов');

    const armedWin = await runConsole(
      battleQuest.solution,
      `runBattle({ name: "Квест", attack: 135, shield: 25, hull: 420 }, { name: "Крейсер", attack: 80, shield: 45, hull: 260 })`,
      {},
    );
    check(armedWin.value?.winner === 'ship', 'с рельсотроном крейсер выбивается');
    check(armedWin.value?.enemyHull === 0, 'у побеждённого противника корпус на нуле');

    // --- Нехватка энергии бьёт по всем модулям ---

    const starved = [
      { type: 'reactor', energy: 120 },
      { type: 'engine', energy: -60 },
      { type: 'drill', energy: -40 },
      { type: 'shield', energy: -30, shield: 25 },
      { type: 'weapon', energy: -50, attack: 40 },
      { type: 'weapon', energy: -90, attack: 95 },
    ];
    const starvedPower = powerEfficiency(starved);
    check(Math.round(starvedPower * 100) === 44, 'перегруженный корабль работает на 44% питания');

    // Рейс на недокормленном корабле привозит заметно меньше руды
    const rich = await runConsole(expedition.solution,
      `runExpedition({ drills: 1, fuel: 300, cargo: 150 }, { hours: 20, fuel: 104, richness: 3 })`, {});
    const poor = await runConsole(expedition.solution,
      `runExpedition({ drills: 1, fuel: 300, cargo: 150 }, { hours: 20, fuel: 104, richness: ${underPower(3, starvedPower)} })`, {});
    check(rich.value?.ore === 60, 'при полном питании рейс привозит полный груз');
    check(poor.value?.ore === 20, 'при нехватке энергии добыча падает втрое');

    // И бой складывается иначе: орудия бьют слабее
    const strongShip = { name: 'Сытый', attack: 135, shield: 25, hull: 420 };
    const weakShip = {
      name: 'Голодный',
      attack: underPower(135, starvedPower),
      shield: underPower(25, starvedPower),
      hull: 420,
    };
    const cruiser = { name: 'Крейсер', attack: 80, shield: 45, hull: 260 };

    const strongFight = await runConsole(battleQuest.solution, `runBattle(${JSON.stringify(strongShip)}, ${JSON.stringify(cruiser)})`, {});
    const weakFight = await runConsole(battleQuest.solution, `runBattle(${JSON.stringify(weakShip)}, ${JSON.stringify(cruiser)})`, {});
    check(strongFight.value?.winner === 'ship', 'сытый корабль побеждает крейсер');
    check(weakFight.value?.rounds > strongFight.value?.rounds, 'голодному кораблю тот же бой даётся тяжелее');

    // --- Второй акт: проект из файлов ---

    resetProgress();
    check(!viewUnlocked('plant'), 'комбинат закрыт, пока цепочка не пройдена');
    check(!isActOneDone(), 'первый акт не считается пройденным на старте');

    // Проект собирается настоящими модулями: тело модуля выполняется один раз
    const projectFilesMap = new Map([
      ['index.js', 'import { двойка } from "./lib/util.js";\nlet стартов = 0;\nстартов += 1;\nexport function итог(n) { return двойка(n) + стартов; }'],
      ['lib/util.js', 'export const двойка = n => n * 2;'],
    ]);

    check(orderModules(projectFilesMap, 'index.js').join(' ') === 'lib/util.js index.js',
      'зависимость грузится раньше точки входа');

    const urls = [];
    const built = buildProject(projectFilesMap, 'index.js', source => {
      const url = URL.createObjectURL(new Blob([source], { type: 'text/javascript' }));
      urls.push(url);
      return url;
    });
    const loaded = await import(built.url);
    check(loaded.итог(4) === 9, 'проект игрока выполняется настоящими модулями');
    check((await import(built.url)) === loaded, 'повторный импорт не перезапускает модуль');
    urls.forEach(url => URL.revokeObjectURL(url));

    // Тот же проект в отдельном процессе
    const inWorker = await runProject({
      files: [...projectFilesMap.entries()],
      entry: 'index.js',
      fn: 'итог',
      args: [4],
    });
    check(inWorker.error === null && inWorker.value === 9, 'отдельный процесс считает то же самое');
    check(inWorker.exports.includes('итог'), 'процесс докладывает, что экспортирует проект');

    const brokenRun = await runProject({ files: [['index.js', 'import "./нет.js";']], entry: 'index.js', fn: 'итог', args: [] });
    check(brokenRun.error?.includes('такого файла в проекте нет'), 'пропавший импорт объясняется словами');

    const noExport = await runProject({ files: [['index.js', 'export const x = 1;']], entry: 'index.js', fn: 'итог', args: [] });
    check(noExport.error?.includes('не экспортирует функцию'), 'отсутствие экспорта названо по имени');

    // Главы: заготовка не проходит, решение проходит
    const firstChapter = chapterChain()[0];
    for (const [path, text] of Object.entries(firstChapter.starters ?? {})) writeFile(path, text);

    const starterReport = await runChapterChecks(firstChapter, projectFiles());
    check(!starterReport.ok, 'по заготовке глава не засчитывается');
    check(starterReport.structure.some(rule => !rule.pass), 'структурная проверка объясняет, чего не хватает');
    check(starterReport.checks.length === 0, 'пока файла нет, код не запускают');

    for (const [path, text] of Object.entries(firstChapter.solution)) writeFile(path, text);
    const solvedReport = await runChapterChecks(firstChapter, projectFiles());
    check(solvedReport.ok, 'решение главы проходит все проверки');
    check(solvedReport.structure.every(rule => rule.pass), 'структура проекта тоже в порядке');

    // Файлы проекта: точку входа не удалить, имена проверяются
    check(writeFile('../взлом.js', '') === null, 'подняться выше проекта нельзя');
    check(writeFile('данные.txt', '') === null, 'в проекте только .js');
    check(removeFile('index.js') === false, 'точку входа удалить нельзя');
    check(removeFile('sort.js') === true && projectFiles()['sort.js'] === undefined, 'обычный файл удаляется');

    resetProgress();
    check(Object.keys(projectFiles()).length === 0, 'сброс очищает проект комбината');
    check(!isChapterDone(firstChapter.id), 'сброс закрывает главы второго акта');

    // --- Панель вывода под редактором ---

    const runShape = {
      ok: false,
      error: null,
      setupLogs: [{ level: 'log', text: 'модуль загружен' }],
      results: [
        { name: 'тихая', call: 'f(1)', pass: true, logs: [], expected: '2', actual: '2' },
        { name: 'болтливая', call: 'f(2)', pass: true, logs: [{ level: 'log', text: 'считаю 2' }], expected: '4', actual: '4' },
        {
          name: 'провальная', call: 'f(3)', pass: false,
          logs: [{ level: 'warn', text: 'странный аргумент' }],
          expected: '6', actual: '5',
        },
      ],
    };

    const output = runOutput(runShape);
    check(output.includes('при загрузке модуля'), 'вывод отделяет то, что напечатал сам модуль');
    check(output.includes('считаю 2'), 'строка console.log попадает в панель');
    check(!output.includes('✓ тихая'), 'пройденная проверка без вывода панель не засоряет');
    check(output.includes('✗ провальная · f(3)'), 'провалившаяся проверка названа вместе с вызовом');
    check(output.includes('log--warn'), 'предупреждение помечено своим уровнем');
    check(output.includes('ждали 6, получили 5'), 'рядом с выводом видно, чем ответ отличается от ожидания');
    check(output.includes('пройдено 2 из 3'), 'итог прогона подписан');

    const okOutput = runOutput({ ...runShape, ok: true, results: runShape.results.slice(0, 2) });
    check(okOutput.includes('все проверки пройдены: 2 из 2'), 'успешный прогон подписан отдельно');

    const brokenOutput = runOutput({ error: 'Код не запустился: Unexpected token', results: [], logs: [] });
    check(brokenOutput.includes('log--error') && brokenOutput.includes('Unexpected token'),
      'ошибка запуска показывается в панели красной строкой');

    const dirty = runOutput({
      ok: true,
      results: [{ name: '<b>имя</b>', call: 'f()', pass: false, logs: [{ level: 'log', text: '<img src=x>' }], expected: '1', actual: '2' }],
    });
    check(!dirty.includes('<img src=x>') && !dirty.includes('<b>имя</b>'), 'вывод экранируется');

    // --- Одна функция, несколько этапов ---

    resetProgress();

    const planStages = stageChain('planFlight');
    check(planStages.length === 3, 'planFlight развивается в трёх заданиях подряд');
    check(planStages.every(stage => stage.fn === 'planFlight'), 'все этапы дорабатывают одну функцию');

    const [stage1, stage2, stage3] = planStages;

    completeQuest(stage1.id, { source: stage1.solution });
    check(activeStageOf('planFlight')?.id === stage1.id, 'рабочей становится версия первого этапа');
    check(activeSourceOf('planFlight') === stage1.solution, 'приложение берёт код именно этого этапа');
    check(previousStageOf(stage1.id) === null, 'у первого этапа предыдущей версии нет');

    const firstPlan = await runPlayerCode('plan', 'return planFlight({ mass: 430, cargo: 600 }, 240);');
    check(firstPlan.value?.fuel === 104, 'первая версия считает рейс по одной массе корабля');

    completeQuest(stage2.id, { source: stage2.solution });
    check(activeStageOf('planFlight')?.id === stage2.id, 'после доработки активна новая версия');
    check(activeSourceOf('planFlight') === stage2.solution, 'рабочий код — код последнего пройденного этапа');
    check(solutionOf(stage1.id) === stage1.solution, 'прежняя версия сохранилась: её можно посмотреть');
    check(previousStageOf(stage2.id)?.id === stage1.id, 'у доработки есть версия для сравнения');
    check(appSource().split('function planFlight').length - 1 === 1,
      'в приложении ровно одно объявление planFlight');

    const cargoPlan = await runPlayerCode('plan', 'return planFlight({ mass: 430, cargo: 600 }, 240);');
    check(cargoPlan.value?.fuel === 248, 'разделы сразу считают по доработанной версии, а не по старой');

    completeQuest(stage3.id, { source: stage3.solution });
    const reservePlan = await runPlayerCode('plan', 'return planFlight({ mass: 430, cargo: 600 }, 240);');
    check(reservePlan.value?.total === 273, 'третья версия добавляет резерв, не ломая расход');
    check(reservePlan.value?.fuel === 248, 'прежнее поле расхода осталось прежним');

    const live = liveFunctions();
    check(live.length === 1, 'в приложении пока одна работающая функция');
    check(live[0].stages.length === 3 && live[0].stage.id === stage3.id,
      'у функции видно три этапа и активный — последний');

    // --- Доработка не ломает прежнее поведение ---

    check(testsOf(stage1).length === stage1.tests.length, 'у первого этапа только свои проверки');
    check(testsOf(stage2).length === stage1.tests.length + stage2.tests.length,
      'доработка прогоняет и свои проверки, и прежние');
    check(testsOf(stage3).every(test => !test.name.includes('поведение · прежнее')),
      'пометка о прежнем поведении не дублируется на третьем этапе');

    const stale = await runSolution(stage1.solution, stage2);
    check(!stale.ok, 'код прежнего этапа не проходит проверки доработки — иначе дорабатывать нечего');

    const reworked = await runSolution(stage2.solution, stage2);
    check(reworked.ok, 'доработанный код проходит и новые проверки, и прежние');
    check(reworked.results.filter(result => result.inherited).length === stage1.tests.length,
      'проверки прежнего поведения помечены отдельно');

    const wider = await runSolution(stage3.solution, stage3);
    check(wider.ok, 'третья версия проходит всё, хотя в ответе появились новые поля');

    check(matchesSubset({ fuel: 104 }, { fuel: 104, reserve: 11 }), 'доработка вправе добавить поле в ответ');
    check(!matchesSubset({ fuel: 104 }, { fuel: 120, reserve: 11 }), 'но прежние значения менять нельзя');
    check(!matchesSubset({ fuel: 104 }, { reserve: 11 }), 'пропавшее прежнее поле — тоже поломка');

    // --- Черновик не подменяет рабочую версию ---

    saveDraft(stage3.id, 'function planFlight() { return null; }');
    check(draftOf(stage3.id).includes('return null'), 'черновик хранится отдельно от решения');
    check(activeSourceOf('planFlight') === stage3.solution, 'сломанный черновик не попадает в приложение');

    const safePlan = await runPlayerCode('plan', 'return planFlight({ mass: 430, cargo: 600 }, 240);');
    check(safePlan.value?.total === 273, 'разделы работают, пока черновик не прошёл тесты');
    saveDraft(stage3.id, stage3.solution);

    // --- Функции игрока видят друг друга ---

    completeQuest('expedition', { source: questById('expedition').solution });
    const chained = await runPlayerCode('expedition', `
      const route = planFlight({ mass: 430, cargo: 150 }, 240);
      return runExpedition(
        { drills: 1, fuel: 300, cargo: 150 },
        { hours: route.hours, fuel: route.total, richness: 3 },
      );
    `);
    check(!chained.error, 'рейс считается связкой из двух функций игрока');
    check(chained.value?.ore === 60 && chained.value?.fuelLeft === 146,
      'следующая функция берёт данные из предыдущей, а не из эталона');

    // --- Журнал топлива и ревизия ---

    resetProgress();
    check(fuelLog().length === 0, 'у новой корпорации журнал топлива пуст');

    addResource('fuel', 200);
    spendResource('fuel', 154);

    const ledgerEntries = fuelLog();
    check(ledgerEntries.length === 2, 'заправка и рейс попали в журнал');
    check(ledgerEntries[0].kind === 'fill' && ledgerEntries[0].amount === 200, 'заправка записана с объёмом');
    check(ledgerEntries[1].kind === 'burn' && ledgerEntries[1].amount === 154, 'расход записан с объёмом');

    const ledgerQuest = questById('ledger');
    check((await runSolution(ledgerQuest.solution, ledgerQuest)).ok, 'решение ревизии проходит тесты');

    const buggy = await runSolution(ledgerQuest.starter, ledgerQuest);
    check(!buggy.ok, 'заготовка ревизии с ошибкой не проходит проверки — её и предстоит починить');

    const audit = await runConsole(ledgerQuest.solution, `fuelBalance(${JSON.stringify(ledgerEntries)})`, {});
    check(audit.value?.in === 200 && audit.value?.out === 154, 'ревизия видит и приход, и расход');
    check(audit.value?.left === resources().fuel, 'остаток по журналу сходится с настоящим баком');

    check(addResource('fuel', TANK_CAPACITY * 2) === TANK_CAPACITY - 46, 'сверх бака не принимается');
    check(fuelLog()[2].amount === TANK_CAPACITY - 46, 'в журнал попадает залитое по факту, а не запрошенное');
    check(spendResource('fuel', 10_000) === false, 'неудачное списание отклоняется');
    check(fuelLog().length === 3, 'несостоявшийся расход в журнал не пишется');

    // --- Склад и корабль — разные места ---

    resetProgress();
    const drill = { id: 'drill-s', uniqueId: 'u-1', name: 'Бур «Проба»', type: 'drill', weight: 40, price: 20000 };
    addInventoryItem(drill);
    check(stockModules().length === 1 && fittedModules().length === 0,
      'купленный модуль лежит на складе, а не на корабле');

    check(installModule('u-1')?.uniqueId === 'u-1', 'модуль ставится на корабль');
    check(stockModules().length === 0 && fittedModules().length === 1, 'после установки он числится на корабле');
    check(installModule('u-1') === null, 'дважды поставить один модуль нельзя');
    check(sellStockModule('u-1') === null, 'установленный модуль со склада не продать');

    check(uninstallModule('u-1', 0).ok === false, 'демонтаж без места на складе не проходит');
    check(fittedModules().length === 1, 'неудачный демонтаж ничего не меняет');
    check(uninstallModule('u-1', 1000).ok === true, 'на свободный склад модуль снимается');
    check(stockModules().length === 1 && fittedModules().length === 0, 'снятый модуль вернулся на склад');

    const refund = sellStockModule('u-1');
    check(refund === 10000, 'сдача модуля возвращает половину цены');
    check(state.credits === 10000 && stockModules().length === 0, 'кредиты начислены, склад пуст');

    resetProgress();
    check(
      Object.keys(state.solved).length === 0 && state.credits === 0 && !corpRecord('commander') && db.count('logs') === 0,
      'сброс возвращает игру в начало и очищает базу',
    );
    check(resources().fuel === 0 && resources().ore === 0, 'сброс опустошает бак и бункер');

    // --- Старое сохранение: всё купленное считалось стоящим на корабле ---

    const KEY = 'codequest.progress.v2';
    const backup = localStorage.getItem(KEY);
    localStorage.setItem(KEY, JSON.stringify({
      version: 1,
      credits: 5000,
      solved: {},
      inventory: [{ uniqueId: 'old-1', name: 'Старый бур', type: 'drill', weight: 40, price: 1000 }],
    }));

    const fresh = await import('../js/state.js?migration=1');
    check(fresh.fittedModules().length === 1, 'модули из старого сохранения оказались на корабле');
    check(fresh.stockModules().length === 0, 'на складе их больше не числится');
    check(fresh.state.credits === 5000, 'кредиты старого сохранения на месте');
    check(Array.isArray(fresh.fuelLog()) && fresh.fuelLog().length === 0, 'журнал топлива заводится пустым');

    localStorage.removeItem(KEY);
    if (backup) localStorage.setItem(KEY, backup);

    document.getElementById('out').textContent = lines.join('\n');
    document.title = problems.length === 0
      ? `smoke: OK (${lines.length} проверок)`
      : `smoke: ПРОБЛЕМ ${problems.length} — ${problems.join('; ')}`;
  </script>
</body>
</html>
